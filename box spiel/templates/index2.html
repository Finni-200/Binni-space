<!DOCTYPE html>
<html>
<head>
    <title>Zufällige Box</title>
    <style>
        body {
            position: relative;
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .box {
            position: absolute;
        }
    </style>
</head>
<body>

<div id="box" class="box"
     style="
        left: {{ x }}px;
        top: {{ y }}px;
        width: {{ breite }}px;
        height: {{ hoehe }}px;
        background-color: {{ farbe }};
     ">
</div>
<script>
    fetch("/fenster", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            width: window.innerWidth,
            height: window.innerHeight
        })
    }).then(() => {
    
    });
</script>
<script>
let box = document.getElementById("box");

function moveBox() {
    let maxX = window.innerWidth - box.offsetWidth;
    let maxY = window.innerHeight - box.offsetHeight;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    box.style.left = x + "px";
    box.style.top = y + "px";
}

box.addEventListener("click", moveBox);
</script>
</body>
</html>
