
<!DOCTYPE html>
<html>
<head>
    <title>Snace</title>

    <style>
        

        body{
    margin: 0;
    overflow: hidden;

    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

        .mehr_kreis{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff9afc, #ff00cc);

    box-shadow:
        0 0 10px #ff00cc,
        0 0 20px #ff00cc,
        0 0 30px #ff00cc;

    transition: left 0.1s linear, top 0.1s linear;
}

        .essen{
    position: absolute;
    width: 30px;
    height: 30px;

    background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
    border-radius: 50%;

    box-shadow:
        0 0 10px red,
        0 0 20px red;
}

<div class="apfel-stiel"></div>

.apfel-stiel{
    position: absolute;
    width: 4px;
    height: 10px;
    background-color: green;

    left: {{ essen_x + 13 }}px;
    top: {{ essen_y - 8 }}px;
}
        #gameOver{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    
    font-size: 60px;
    font-weight: bold;
    color: white;

    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px red;

    display: none;
}
    </style>
</head>

<body>

<div id="gameOver">GAME OVER</div>

{% for k in kreise_für_render %}
<div id="kreis{{ loop.index0 }}" class="mehr_kreis"
     style="
     width: {{k.durchmesser}}px;
     height: {{k.durchmesser}}px;
     background-color: {{k.farbe}};
     left: {{k.x}}px;
     top: {{k.y}}px;">
</div>
{% endfor %}

<div class="essen"></div>
<div class="apfel-stiel"></div>

<script>

let spielfeldBreite = window.innerWidth;
let spielfeldHoehe = window.innerHeight;

let aktuelleRichtung = "right";
let gameOver = false;

window.addEventListener("resize", () => {
    spielfeldBreite = window.innerWidth;
    spielfeldHoehe = window.innerHeight;
});

document.addEventListener("keydown", function(event){

    if(event.key === "w" || event.key === "ArrowUp") aktuelleRichtung = "up";
    if(event.key === "s" || event.key === "ArrowDown") aktuelleRichtung = "down";
    if(event.key === "a" || event.key === "ArrowLeft") aktuelleRichtung = "left";
    if(event.key === "d" || event.key === "ArrowRight") aktuelleRichtung = "right";

});


function bewegeSchlange(){

    if(gameOver) return;

     fetch(`/move?richtung=${aktuelleRichtung}&breite=${spielfeldBreite}&hoehe=${spielfeldHoehe}`)
    .then(response => response.json())
    .then(data => {

        // 💀 Game Over
        if(data.status === "game over"){
            document.getElementById("gameOver").style.display = "block";
            gameOver = true;
            return;
        }

        // 🟢 Kreise updaten
        for(let i = 0; i < data.kreise.length; i++){
            let kreis = document.getElementById("kreis" + i);

            if(!kreis){
                kreis = document.createElement("div");
                kreis.id = "kreis" + i;
                kreis.className = "mehr_kreis";
                kreis.style.position = "absolute";
                kreis.style.borderRadius = "50%";
                kreis.style.width = "50px";
                kreis.style.height = "50px";
                kreis.style.backgroundColor = "pink";
                document.body.appendChild(kreis);
            }

            if(i === 0){
        kreis.style.background = "radial-gradient(circle, #00ffcc, #0099ff)";
    } else {
        kreis.style.background = "radial-gradient(circle at 30% 30%, #ff9afc, #ff00cc)";
    }

            kreis.style.left = data.kreise[i].x + "px";
            kreis.style.top = data.kreise[i].y + "px";
        }

        // 🍎 Essen updaten
        if(data.essen){
            let essen = document.querySelector(".essen");
            essen.style.left = data.essen.x + "px";
            essen.style.top = data.essen.y + "px";
        }

    });

}
setInterval(bewegeSchlange, 200);
</script>

</body>
</html>
