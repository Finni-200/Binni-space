
<!DOCTYPE html>
<html>
<head>
    <title>Snace</title>

    <style>
        

        body{
    margin: 0;
    overflow: hidden;

    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
}

        .mehr_kreis{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff9afc, #ff00cc);

    box-shadow:
        0 0 10px #ff00cc,
        0 0 20px #ff00cc,
        0 0 30px #ff00cc;

    transition: left 0.2s linear, top 0.2s linear;
}

    #levelAnzeige{
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);

    font-size: 40px;
    font-weight: bold;

    color: white;

    background: radial-gradient(circle at 30% 30%, #ff9afc, #ff00cc);

    padding: 10px 25px;
    border-radius: 20px;

    box-shadow:
        0 0 10px #ff00cc,
        0 0 20px #ff00cc,
        0 0 40px #ff00cc;

    text-shadow:
        0 0 5px white,
        0 0 10px #ff00cc;
}


        .essen{
    position: absolute;
    width: 30px;
    height: 30px;

    background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
    border-radius: 50%;

    box-shadow:
        0 0 10px red,
        0 0 20px red;
}



.apfel-stiel{
    position: absolute;
    width: 4px;
    height: 10px;
    background-color: green;

    left: {{ essen_x + 13 }}px;
    top: {{ essen_y - 8 }}px;
}
        #gameOver{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    
    font-size: 60px;
    font-weight: bold;
    color: white;

    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px red;

    display: none;
}
    </style>
</head>

<body>

<div id="gameOver">GAME OVER</div>

{% for k in kreise_für_render %}
<div id="kreis{{ loop.index0 }}" class="mehr_kreis"
     style="
     width: {{k.durchmesser}}px;
     height: {{k.durchmesser}}px;
     background-color: {{k.farbe}};
     left: {{k.x}}px;
     top: {{k.y}}px;">
</div>
{% endfor %}

<div class="essen"></div>
<div class="apfel-stiel"></div>
<div id="levelAnzeige">LEVEL 1</div>

<script>






let spielfeldBreite = window.innerWidth;
let spielfeldHoehe = window.innerHeight;

let richtungSpieler1 = "right";
let richtungSpieler2 = "down";
let gameOver = false;

window.addEventListener("resize", () => {
    spielfeldBreite = window.innerWidth;
    spielfeldHoehe = window.innerHeight;
});

window.addEventListener("keydown", (event) => {
    if (event.key === "w") richtungSpieler1 = "up";
    if (event.key === "s") richtungSpieler1 = "down";
    if (event.key === "a") richtungSpieler1 = "left";
    if (event.key === "d") richtungSpieler1 = "right";

    if (event.key === "ArrowUp") richtungSpieler2 = "up";
    if (event.key === "ArrowDown") richtungSpieler2 = "down";
    if (event.key === "ArrowLeft") richtungSpieler2 = "left";
    if (event.key === "ArrowRight") richtungSpieler2 = "right";
});


function bewegeSchlange(){

    if(gameOver) return;

    fetch(`/move?richtung1=${richtungSpieler1}&richtung2=${richtungSpieler2}&breite=${spielfeldBreite}&hoehe=${spielfeldHoehe}`)
    .then(response => response.json())
    .then(data => {


let länge = data.kreise.length;
let level = 1;
if(länge >= 20){
    speed = 70;
    level = 5;
}
else if(länge >= 15){
    speed = 100;
    level = 4;
}
else if(länge >= 10){
    speed = 130;
    level = 3;
}
else if(länge >= 5){
    speed = 170;
    level = 2;
}
else{
    speed = 200;
    level = 1;
}
document.getElementById("levelAnzeige").innerText = "LEVEL " + level;

        // 💀 Game Over
        if(data.status === "game over"){
            document.getElementById("gameOver").style.display = "block";
            gameOver = true;
            return;
        }

        // 🟢 Kreise updaten
        for(let i = 0; i < data.kreise.length; i++){
            let kreis = document.getElementById("kreis" + i);

            if(!kreis){
                kreis = document.createElement("div");
                kreis.id = "kreis" + i;
                kreis.className = "mehr_kreis";
                kreis.style.position = "absolute";
                kreis.style.borderRadius = "50%";
                kreis.style.width = data.kreise[i].durchmesser + "px";
                kreis.style.height = data.kreise[i].durchmesser + "px";
                document.body.appendChild(kreis);
            }

            kreis.style.background = data.kreise[i].farbe;
            kreis.style.left = data.kreise[i].x + "px";
            kreis.style.top = data.kreise[i].y + "px";
        }

        // 🍎 Essen updaten
        if(data.essen){
            let essen = document.querySelector(".essen");
            essen.style.left = data.essen.x + "px";
            essen.style.top = data.essen.y + "px";
        }

    });

}

let speed = 200; // Startgeschwindigkeit

function gameLoop(){

    if(gameOver) return;

    bewegeSchlange();

    setTimeout(gameLoop, speed);
}

// 👉 starten
gameLoop();


</script>

</body>
</html>
