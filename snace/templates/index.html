<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Snace</title>

    <style>
html, body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:linear-gradient(135deg,#08131f,#10283d,#061018);
    font-family:Arial,Helvetica,sans-serif;
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

/* Spielfeld */
#spielfeld{
    fill:#081018;
    stroke:#ff006e;
    stroke-width:5;

    filter:
        drop-shadow(0 0 8px #ff006e)
        drop-shadow(0 0 18px #ff006e);
}

/* Schlangenkopf */
#circle-0{
    fill:url(#kopfGradient);
    stroke:#ffffff;
    stroke-width:2;

    filter:
        drop-shadow(0 0 10px #00e5ff)
        drop-shadow(0 0 20px #00e5ff);
}

/* Schlangenkörper */
[id^="circle-"]:not(#circle-0){
    fill:url(#bodyGradient);

    stroke:#ffb3ff;
    stroke-width:1.5;

    filter:
        drop-shadow(0 0 6px #ff00cc)
        drop-shadow(0 0 14px #ff00cc);
}

/* Essen */
[id^="food-"]{
    fill:url(#foodGradient);
    stroke:#ffffff;
    stroke-width:2;
    filter:
        drop-shadow(0 0 8px red)
        drop-shadow(0 0 18px red);
}

/* Essen klein */
[id^="small_food-"]{
    fill:url(#small_foodGradient);
    stroke:#ffffff;
    stroke-width:2;
    filter:
        drop-shadow(0 0 8px red)
        drop-shadow(0 0 18px rgb(255, 0, 0));
}

</style>
</head>

<body>

<svg
    id="field"
    xmlns="http://www.w3.org/2000/svg"
    width="100%"
    height="100%">

    <rect
        id="spielfeld"
        x="{{ spielrand }}"
        y="{{ spielrand }}"
        fill="none"
        stroke="{{ line_color }}"
        stroke-width="{{ line_width }}" />

    {% for c in circles %}
    <circle
        id="circle-{{ loop.index0 }}"
        cx="{{ c.cx }}"
        cy="{{ c.cy }}"
        r="{{ c.r }}"
        fill="{{ c.color }}"
        stroke="none"/>
    {% endfor %}

    {% for food in foods %}
    <circle
        id="food-{{ loop.index0 }}"
        cx="{{ food.cx }}"
        cy="{{ food.cy }}"
        r="{{ food.r }}"
        fill="url(#foodGradient)"
        stroke="none"/>
    {% endfor %}

    {% for small_food in small_foods %}
    <circle
        id="small_food-{{ loop.index0 }}"
        cx="{{ small_food.cx }}"
        cy="{{ small_food.cy }}"
        r="{{ small_food.r }}"
        fill="url(#small_foodGradient)"
        stroke="none"/>
    {% endfor %}

</svg>


<defs>

<radialGradient id="kopfGradient">
    <stop offset="0%" stop-color="#b6fff7"/>
    <stop offset="100%" stop-color="#00b7ff"/>
</radialGradient>

<radialGradient id="bodyGradient">
    <stop offset="0%" stop-color="#ffc8ff"/>
    <stop offset="100%" stop-color="#ff00b7"/>
</radialGradient>

<radialGradient id="foodGradient">
    <stop offset="0%" stop-color="#fff27d"/>
    <stop offset="40%" stop-color="#ff5555"/>
    <stop offset="100%" stop-color="#9c0000"/>
</radialGradient>

<radialGradient id="small_foodGradient">
    <stop offset="0%" stop-color="#008000"/>
    <stop offset="100%" stop-color="#00ff00"/>
</radialGradient>

</defs>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
