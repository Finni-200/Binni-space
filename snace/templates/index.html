<!DOCTYPE html>
<html>
<head>
    <title>Snace</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0f3f 25%, #0f1a3f 50%, #0a0e27 75%, #000000 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            font-family: sans-serif;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,.2)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(0,0,0,.3)),
                radial-gradient(1px 1px at 50px 50px, #fff, rgba(0,0,0,.2)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(0,0,0,.2)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(0,0,0,.3));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.5;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        canvas#bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .mehr_kreis {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, currentColor 40%, #000 120%);
            box-shadow:
                0 0 8px currentColor,
                0 0 20px currentColor,
                0 0 40px currentColor,
                inset 0 0 10px rgba(255,255,255,0.5);
            transition: all 0.07s linear;
            animation: snakePulse 0.6s infinite alternate;
            z-index: 10;
        }

        @keyframes snakePulse {
            from { transform: scale(0.95); }
            to   { transform: scale(1.05); }
        }

        .kopf {
            transform: scale(1.35);
            z-index: 20;
        }

        .auge {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
        }

        .auge::after {
            content: "";
            position: absolute;
            width: 6px;
            height: 6px;
            background: black;
            border-radius: 50%;
            top: 3px;
            left: 3px;
        }

        .essen {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #ff0000);
            box-shadow:
                0 0 15px red,
                0 0 35px red,
                0 0 70px red;
            z-index: 10;
        }

        #gameOver {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            width: 100vw;
            text-align: center;
            font-size: 90px;
            font-weight: bold;
            color: white;
            display: none;
            animation: gameOverAnim 1s forwards;
            text-shadow:
                0 0 30px red,
                0 0 60px red,
                0 0 100px red;
            z-index: 100;
        }

        body.game-over {
            background: #000 !important;
            animation: none !important;
        }

        body.game-over::before {
            opacity: 0 !important;
        }

        body.game-over .mehr_kreis,
        body.game-over .essen,
        body.game-over #warteAnzeige,
        body.game-over #spielerAnzeige {
            display: none !important;
        }

        @keyframes gameOverAnim {
            to {
                transform: translate(-50%, -50%) scale(1.3);
            }
        }
    </style>
</head>

<body>

<div id="gameOver">GAME OVER</div>
<div id="warteAnzeige">⏳ Warte auf grünen Spieler...</div>
<div id="spielerAnzeige"></div>

{% for k in kreise_für_render %}
<div id="kreis{{ loop.index0 }}" class="mehr_kreis"
     style="width: {{k.durchmesser}}px; height: {{k.durchmesser}}px; left: {{k.x}}px; top: {{k.y}}px;">
</div>
{% endfor %}

<div class="essen"></div>

<!-- 🎵 Hintergrundmusik -->
<audio id="bgmusik" loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script>
const socket = io();
let gameOver = false;
let meineSpielerNummer = null;

socket.on('spieler_nummer', function(data) {
    meineSpielerNummer = data.nummer;
    const display = document.getElementById('spielerAnzeige');
    if (display) {
        if (data.nummer === 1) {
            display.textContent = 'du bist gelb';
        } else if (data.nummer === 2) {
            display.textContent = 'du bist grün';
        }
        display.style.display = 'block';
    }
});

socket.on('spiel_start', function() {
    const waiting = document.getElementById('warteAnzeige');
    if (waiting) {
        waiting.textContent = 'Spiel gestartet!';
    }
});

const musik = document.getElementById("bgmusik");
musik.volume = 0.4;

// 🔥 Versuch: sofort starten
window.addEventListener("load", () => {
    musik.play().catch(() => {
        console.log("Autoplay blockiert → warte auf Taste");
    });
});

// 🔥 Fallback: startet bei erster Taste (funktioniert IMMER)
let musikGestartet = false;
window.addEventListener("keydown", () => {
    if (!musikGestartet) {
        musik.play();
        musikGestartet = true;
    }
});
window.addEventListener("keydown", (event) => {
    if (gameOver || !meineSpielerNummer) return;

    let richtung = null;

    if (event.key === "w" || event.key === "ArrowUp") richtung = "up";
    else if (event.key === "s" || event.key === "ArrowDown") richtung = "down";
    else if (event.key === "a" || event.key === "ArrowLeft") richtung = "left";
    else if (event.key === "d" || event.key === "ArrowRight") richtung = "right";

    if (richtung) {
        socket.emit("richtung", { richtung: richtung });
    }
});

socket.on('zustand', function(data) {

    if (data.status === "game over") {
        document.body.classList.add("game-over");
        document.getElementById("gameOver").style.display = "block";

        // 🔇 Musik stoppen
        document.getElementById("bgmusik").pause();

        gameOver = true;
        return;
    }

    if (!data.kreise) return;

    for (let i = 0; i < data.kreise.length; i++) {

        let kreis = document.getElementById("kreis" + i);

        if (!kreis) {
            kreis = document.createElement("div");
            kreis.id = "kreis" + i;
            kreis.className = "mehr_kreis";
            document.body.appendChild(kreis);
        }

        // 🐍 richtige Spielerfarben
        if (data.kreise[i].farbe === "pink") {
            kreis.style.background = "#E9967A";
        } else if (data.kreise[i].farbe === "cyan") {
            kreis.style.background = "#8FBC8F";
        }

        kreis.style.width  = data.kreise[i].durchmesser + "px";
        kreis.style.height = data.kreise[i].durchmesser + "px";
        kreis.style.left   = data.kreise[i].x + "px";
        kreis.style.top    = data.kreise[i].y + "px";

        // 👀 Kopf mit Augen
        if (i === 0) {
            kreis.classList.add("kopf");

            if (!kreis.querySelector(".auge")) {
                const auge1 = document.createElement("div");
                const auge2 = document.createElement("div");

                auge1.className = "auge";
                auge2.className = "auge";

                auge1.style.left = "10px";
                auge1.style.top  = "10px";

                auge2.style.left = "30px";
                auge2.style.top  = "10px";

                kreis.appendChild(auge1);
                kreis.appendChild(auge2);
            }
        } else {
            kreis.classList.remove("kopf");
            kreis.innerHTML = "";
        }
    }

    // alte Kreise löschen
    let i = data.kreise.length;
    while (document.getElementById("kreis" + i)) {
        document.getElementById("kreis" + i).remove();
        i++;
    }

    // 🍎 Essen
    if (data.essen) {
        const essen = document.querySelector(".essen");
        essen.style.left = data.essen.x + "px";
        essen.style.top  = data.essen.y + "px";
    }
});
</script>

</body>
</html>
