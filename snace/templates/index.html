<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Snace</title>

    <style>
html, body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:linear-gradient(135deg,#08131f,#10283d,#061018);
    font-family:Arial,Helvetica,sans-serif;
}

#intro-screen{
    position:fixed;
    inset:0;
    z-index:2;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:radial-gradient(ellipse at center,#122a3d 0%,#08131f 64%,#061018 100%);
}

#intro-screen[hidden]{
    display:none;
}

.intro-orb{
    position:absolute;
    width:clamp(72px,12vw,150px);
    aspect-ratio:1;
    border:2px solid #ffb3ff;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffc8ff,#ff00b7 75%);
    box-shadow:0 0 12px #ff00cc,0 0 34px #ff00cc;
    opacity:.8;
}

.intro-orb.one{top:12%;left:12%;}
.intro-orb.two{right:12%;bottom:13%;width:clamp(48px,8vw,100px);border-color:#b6fff7;background:radial-gradient(circle at 35% 30%,#b6fff7,#00b7ff 75%);box-shadow:0 0 12px #00e5ff,0 0 34px #00e5ff;}
.intro-orb.three{right:24%;top:16%;width:clamp(24px,4vw,50px);border:1px solid #fff27d;background:radial-gradient(circle at 35% 30%,#fff27d,#ff5555 75%);box-shadow:0 0 10px #ff5555,0 0 24px #ff5555;}

.intro-content{
    position:relative;
    z-index:1;
    width:min(620px,calc(100% - 40px));
    padding:48px 28px;
    text-align:center;
}

.intro-content h1{
    margin:0 0 18px;
    color:#fff;
    font-size:clamp(32px,7vw,64px);
    text-shadow:0 0 10px #00e5ff,0 0 28px #00b7ff;
}

.intro-content p{
    margin:0;
    color:#ffc8ff;
    font-size:clamp(20px,4vw,30px);
    text-shadow:0 0 10px #ff00cc,0 0 24px #ff00cc;
}

#start-button{
    padding:14px 28px;
    border:2px solid #b6fff7;
    border-radius:999px;
    background:#063043;
    color:#fff;
    font:700 18px Arial,Helvetica,sans-serif;
    cursor:pointer;
    box-shadow:0 0 10px #00e5ff,0 0 26px #00b7ff,inset 0 0 12px #00b7ff;
}

#intro-actions{
    position:absolute;
    right:clamp(20px,5vw,64px);
    bottom:clamp(20px,5vh,48px);
    z-index:2;
    display:flex;
    gap:12px;
}

#close-button{
    padding:14px 22px;
    border:2px solid #ffb3ff;
    border-radius:999px;
    background:#360d36;
    color:#fff;
    font:700 18px Arial,Helvetica,sans-serif;
    cursor:pointer;
    box-shadow:0 0 10px #ff00cc,0 0 26px #ff00cc,inset 0 0 12px #ff00b7;
}

#start-button:hover,#start-button:focus-visible{
    background:#07516a;
    outline:2px solid #fff;
    outline-offset:4px;
}

#close-button:hover,#close-button:focus-visible{
    background:#5a1257;
    outline:2px solid #fff;
    outline-offset:4px;
}

#intro-comparison{
    margin-top:14px;
    color:#b6fff7;
    font-size:18px;
    text-shadow:0 0 9px #00e5ff,0 0 20px #00b7ff;
}

#quit-button{
    position:fixed;
    right:clamp(20px,5vw,64px);
    bottom:clamp(20px,5vh,48px);
    z-index:1;
    padding:12px 22px;
    border:2px solid #ffb3ff;
    border-radius:999px;
    background:#360d36;
    color:#fff;
    font:700 16px Arial,Helvetica,sans-serif;
    cursor:pointer;
    box-shadow:0 0 10px #ff00cc,0 0 26px #ff00cc,inset 0 0 12px #ff00b7;
}

#quit-button:hover,#quit-button:focus-visible{
    background:#5a1257;
    outline:2px solid #fff;
    outline-offset:4px;
}

svg{
    width:100vw;
    height:100vh;
    display:block;
}

/* Spielfeld */
#spielfeld{
    fill:#081018;
    stroke:#ff006e;
    stroke-width:5;

    filter:
        drop-shadow(0 0 8px #ff006e)
        drop-shadow(0 0 18px #ff006e);
}

/* Schlangenkopf */
#circle-0{
    fill:url(#kopfGradient);
    stroke:#ffffff;
    stroke-width:2;

    filter:
        drop-shadow(0 0 10px #00e5ff)
        drop-shadow(0 0 20px #00e5ff);
}

/* Schlangenkörper */
[id^="circle-"]:not(#circle-0){
    fill:url(#bodyGradient);

    stroke:#ffb3ff;
    stroke-width:1.5;

    filter:
        drop-shadow(0 0 6px #ff00cc)
        drop-shadow(0 0 14px #ff00cc);
}

/* Essen */
[id^="food-"]{
    fill:url(#foodGradient);
    stroke:#ffffff;
    stroke-width:2;
    filter:
        drop-shadow(0 0 8px red)
        drop-shadow(0 0 18px red);
}

/* Essen klein */
[id^="small_food-"]{
    fill:url(#small_foodGradient);
    stroke:#ffffff;
    stroke-width:2;
    filter:
        drop-shadow(0 0 8px red)
        drop-shadow(0 0 18px rgb(255, 0, 0));
}

#angry-bird-0{
    fill:#2da44e;
    stroke:#1a7f37;
    stroke-width:2;
    filter:drop-shadow(0 0 6px rgba(45,164,78,0.65));
}

</style>
</head>

<body>

<section id="intro-screen" aria-labelledby="intro-title">
    <span class="intro-orb one" aria-hidden="true"></span>
    <span class="intro-orb two" aria-hidden="true"></span>
    <span class="intro-orb three" aria-hidden="true"></span>
    <div class="intro-content">
        <h1 id="intro-title">Snace</h1>
        <p id="intro-score">{% if last_result %}Dein letzter Score ist {{ last_result.score }}{% else %}Noch kein Score gespeichert{% endif %}</p>
        <p id="intro-comparison" hidden></p>
    </div>
    <div id="intro-actions">
        <button id="start-button" type="button">Weiter</button>
        <button id="close-button" type="button" hidden>Schließen</button>
    </div>
</section>
<button id="quit-button" type="button" hidden>Aufhören</button>

<svg
    id="field"
    xmlns="http://www.w3.org/2000/svg"
    width="100%"
    height="100%">

    <text
        id="level-text"
        x="{{ spielrand + 20 }}"
        y="{{ spielrand - 10 }}"
        fill="#ffffff"
        font-size="28"
        font-weight="700"
        font-family="Arial, Helvetica, sans-serif">Level {{ current_level }}</text>

    <text
        id="score-text"
        x="{{ spielrand + 220 }}"
        y="{{ spielrand - 10 }}"
        fill="#ffffff"
        font-size="24"
        font-weight="700"
        font-family="Arial, Helvetica, sans-serif">Punkte: {{ current_score }}</text>

    <text
        id="last-result-text"
        x="{{ spielrand + 20 }}"
        y="{{ spielrand + 35 }}"
        fill="#ffffff"
        font-size="18"
        font-family="Arial, Helvetica, sans-serif">{% if last_result %}Letztes Spiel: {{ last_result.score }} Punkte{% if last_result.previous_score is not none %}, {{ last_result.comparison }} als zuvor ({{ last_result.previous_score }}){% else %}, {{ last_result.comparison }}{% endif %}{% else %}Noch kein gespeicherter Score{% endif %}</text>

    <rect
        id="spielfeld"
        x="{{ spielrand }}"
        y="{{ spielrand }}"
        fill="none"
        stroke="{{ line_color }}"
        stroke-width="{{ line_width }}" />

    {% for c in circles %}
    <circle
        id="circle-{{ loop.index0 }}"
        cx="{{ c.cx }}"
        cy="{{ c.cy }}"
        r="{{ c.r }}"
        fill="{{ c.color }}"
        stroke="none"/>
    {% endfor %}

    {% for food in foods %}
    <circle
        id="food-{{ loop.index0 }}"
        cx="{{ food.cx }}"
        cy="{{ food.cy }}"
        r="{{ food.r }}"
        fill="url(#foodGradient)"
        stroke="none"/>
    {% endfor %}

    {% for small_food in small_foods %}
    <circle
        id="small_food-{{ loop.index0 }}"
        cx="{{ small_food.cx }}"
        cy="{{ small_food.cy }}"
        r="{{ small_food.r }}"
        fill="url(#small_foodGradient)"
        stroke="none"/>
    {% endfor %}

    {% for angry_bird in angry_birds %}
    <path
        id="angry-bird-{{ loop.index0 }}"
        data-cx="{{ angry_bird.cx }}"
        data-cy="{{ angry_bird.cy }}"
        data-r="{{ angry_bird.r }}"
        fill="{{ angry_bird.color }}" />
    {% endfor %}

</svg>


<defs>

<radialGradient id="kopfGradient">
    <stop offset="0%" stop-color="#b6fff7"/>
    <stop offset="100%" stop-color="#00b7ff"/>
</radialGradient>

<radialGradient id="bodyGradient">
    <stop offset="0%" stop-color="#ffc8ff"/>
    <stop offset="100%" stop-color="#ff00b7"/>
</radialGradient>

<radialGradient id="foodGradient">
    <stop offset="0%" stop-color="#fff27d"/>
    <stop offset="40%" stop-color="#ff5555"/>
    <stop offset="100%" stop-color="#9c0000"/>
</radialGradient>

<radialGradient id="small_foodGradient">
    <stop offset="0%" stop-color="#008000"/>
    <stop offset="100%" stop-color="#00ff00"/>
</radialGradient>

</defs>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
