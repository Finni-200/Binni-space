<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>binni-space</title>

<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
  background: #e3e6ef;
}

/* HINTERGRUND */
.background {
  position: fixed;
  inset: 0;
  background: url("ich.png") center / cover no-repeat;
  filter: blur(10px) brightness(1.1) saturate(1.3);
  transform: scale(1.05);
  z-index: -10;
}

/* LICHT */
.light {
  position: absolute;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: 0.8;
  animation: moveLight 6s infinite alternate ease-in-out;
}

.light.gold { background:#ffcc33; left:5%; top:25%; }
.light.blue { background:#33ccff; right:5%; top:30%; animation-delay:1s; }
.light.pink { background:#ff66cc; left:35%; bottom:10%; animation-delay:2s; }

@keyframes moveLight {
  from { transform: translateY(0); }
  to   { transform: translateY(-70px); }
}

/* ÜBERSCHRIFT */
.content {
  position: relative;
  text-align: center;
  padding-top: 60px;
  z-index: 5;
}

/* BUTTON-CONTAINER */
.buttons {
  position: absolute;
  top: 55%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  gap: 50px;
  z-index: 10;
}

/* BUTTONS */
.neon-btn {
  font-size: 36px;
  font-weight: bold;
  color: white;
  padding: 26px 60px;
  border: none;
  border-radius: 18px;
  cursor: pointer;

  background: #1e90ff;   /* BLAU */
  box-shadow: 0 0 15px rgba(30,144,255,0.6);
}

.neon-btn:hover {
  background: #187bcd;
  transform: scale(1.05);
}

/* BUTTONS */
.neon-btn {
  font-size: 36px;
  font-weight: bold;
  color: white;
  padding: 26px 60px;
  border: none;
  border-radius: 18px;
  cursor: pointer;

  background: #1e90ff;   /* BLAU */
  box-shadow: 0 0 15px rgba(30,144,255,0.6);
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.neon-btn:hover {
  background: #187bcd;
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(30,144,255,0.9);
}


@keyframes neonFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
</style>
</head>

<body>

<!-- BUTTONS -->
<div class="buttons">
  <button class="neon-btn"
    onclick="window.open('http://www.dj-finnibee.binni-space.com', '_blank')">
    DJ
  </button>

  <button class="neon-btn"
    onclick="window.open('http://www.gitarre.binni-space.com', '_blank')">
    Gitarre
  </button>

  <button class="neon-btn"
    onclick="window.open('http://www.allround.binni-space.com', '_blank')">
    Allround
  </button>

  <button class="neon-btn"
    onclick="window.open('http://www.gaming.binni-space.com', '_blank')">
    Gaming
  </button>
</div>

<!-- HINTERGRUND -->
<div class="background"></div>

<!-- LICHT -->
<div class="light gold"></div>
<div class="light blue"></div>
<div class="light pink"></div>

<!-- ÜBERSCHRIFT -->
<div class="content">
  <svg width="600" height="180">
    <path id="curve" d="M 50 140 Q 300 20 550 140" fill="transparent"/>
    <text>
      <textPath href="#curve" startOffset="50%" text-anchor="middle"
        fill="#222" font-size="46" font-weight="bold">
        Welcome to binni-space
      </textPath>
    </text>
  </svg>
</div>

</body>
</html>
